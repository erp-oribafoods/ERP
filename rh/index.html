<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP RH SECOP &amp; FOOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sidebar navigation + working area; brand purple/green from the SECOP PVC / Oriba Food letterhead */
:root{
  --bg:#f5f4f8; --surface:#ffffff; --surface2:#f0eef6; --ink:#1f1b2b; --muted:#6a6578; --line:#e2dfeb;
  --brand:#3b1f7a; --brand-ink:#ffffff; --accent:#2e8b3d; --accent-soft:#e6f3e8; --brand-soft:#ece8f6;
  --ok:#2e8b3d; --warn:#b26a00; --warn-soft:#fff3df; --bad:#c0352b; --bad-soft:#fde8e6;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15121d; --surface:#1d1928; --surface2:#262135; --ink:#ece9f4; --muted:#a29cb3; --line:#332d45;
  --brand:#8f74d6; --brand-ink:#120d1e; --accent:#5cc070; --accent-soft:#1d3323; --brand-soft:#2a2342;
  --ok:#5cc070; --warn:#f0a43a; --warn-soft:#3a2b12; --bad:#f07067; --bad-soft:#3d1e1c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15121d; --surface:#1d1928; --surface2:#262135; --ink:#ece9f4; --muted:#a29cb3; --line:#332d45;
  --brand:#8f74d6; --brand-ink:#120d1e; --accent:#5cc070; --accent-soft:#1d3323; --brand-soft:#2a2342;
  --ok:#5cc070; --warn:#f0a43a; --warn-soft:#3a2b12; --bad:#f07067; --bad-soft:#3d1e1c; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--brand);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
:root[data-theme="dark"] aside{background:#241a45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) aside{background:#241a45}}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.5px;padding:4px 10px 2px}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:12px;opacity:.75;letter-spacing:0}
.logo-bar{height:3px;background:#5cc070;margin:10px 10px 14px;border-radius:2px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;text-decoration:none;padding:9px 10px;border-radius:8px;opacity:.86;font-weight:500}
nav a:hover{background:rgba(255,255,255,.08);opacity:1}
nav a.on{background:rgba(255,255,255,.16);opacity:1;box-shadow:inset 3px 0 0 #5cc070}
nav a .cnt{background:#c0352b;color:#fff;border-radius:10px;font-size:12px;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;font-size:12px;opacity:.7;padding:10px}
main{padding:22px 26px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;color:var(--brand);text-wrap:balance}
:root[data-theme="dark"] h1{color:#cbbcf5}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 10px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;margin-top:6px}
.kpi.stripe-ok{border-top:4px solid var(--ok)} .kpi.stripe-warn{border-top:4px solid var(--warn)} .kpi.stripe-bad{border-top:4px solid var(--bad)} .kpi.stripe-brand{border-top:4px solid var(--brand)}
.bar{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.dan{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
textarea{min-height:70px;resize:vertical}
.search{min-width:220px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;background:var(--surface2);color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;padding:9px 10px;white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--brand-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td input{width:100%;min-width:80px;padding:5px 7px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--accent-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-n{background:var(--surface2);color:var(--muted)} .p-b{background:var(--brand-soft);color:var(--brand)}
:root[data-theme="dark"] .p-b{color:#cbbcf5}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.d-bad{background:var(--bad)} .d-warn{background:var(--warn)} .d-ok{background:var(--ok)} .d-b{background:var(--brand)}
.muted{color:var(--muted)} .small{font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--brand);border-bottom-color:var(--accent)}
:root[data-theme="dark"] .tabs button.on{color:#cbbcf5}
.empty{padding:30px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,14,35,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:20}
.ov.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:min(860px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(1100px,100%)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.form label.full{grid-column:1/-1}
.form label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.fsec{grid-column:1/-1;font-family:var(--display);font-weight:600;font-size:16px;color:var(--brand);border-bottom:2px solid var(--accent);padding-bottom:3px;margin-top:8px}
:root[data-theme="dark"] .fsec{color:#cbbcf5}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.pieces{display:grid;gap:6px}
.piece{display:grid;grid-template-columns:28px 1fr 150px 170px;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--surface2)}
.piece.ok{background:var(--accent-soft)}
.piece input[type=checkbox]{width:18px;height:18px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:40;opacity:0;transform:translateY(10px);transition:.2s;max-width:360px}
.toast.show{opacity:1;transform:none}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.svc .card{padding:12px}
.svc .card b{font-family:var(--display);font-size:26px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.mobile-nav{display:none}
#auth{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:30;overflow:auto}
#auth.open{display:flex}
.authbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(420px,100%);box-shadow:0 10px 40px rgba(30,20,60,.12)}
.authbox h1{font-size:28px}.authbox .form{grid-template-columns:1fr}
.authlogo{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brand) 0 60%,var(--accent) 60%);margin-bottom:18px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.side-foot .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);margin-top:6px;width:100%}
.side-foot b{display:block;font-size:14px}
a{color:var(--brand);text-underline-offset:2px}
:root[data-theme="dark"] a{color:#cbbcf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a{color:#cbbcf5}}
nav a{color:#fff!important}
td b{white-space:nowrap}
.nw{flex-wrap:nowrap}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}
  aside .logo,aside .logo-bar,aside .side-foot{display:none}
  nav{display:flex;gap:4px} nav a{white-space:nowrap}
  main{padding:16px}
  .piece{grid-template-columns:28px 1fr}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">ERP RH<small>SECOP &amp; FOOD · Procédure RH-01</small></div>
    <div class="logo-bar"></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="who"></div>
  </aside>
  <main id="main"><div class="empty">Chargement des données…</div></main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="auth"><div class="authbox" id="authbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv" hidden>

<script>
"use strict";
/* ================= CONSTANTES ================= */
const ENTITES=["SECOP","FOOD"];
const PIECES=[
 ["p1","Fiche individuelle de renseignements",true],["p2","Copie d'une pièce d'identité valide",true],["p3","Curriculum vitae",true],
 ["p4","Copies des diplômes et attestations professionnelles utiles",true],["p5","Contrat de travail signé",true],["p6","Fiche de poste",true],
 ["p7","Documents relatifs à l'embauche",true],["p8","Avenants éventuels au contrat",false],["p9","Documents relatifs aux congés et permissions",false],
 ["p10","Courriers et correspondances administratives",false],["p11","Documents relatifs aux formations et évaluations",false],
 ["p12","Documents relatifs aux mesures disciplinaires, le cas échéant",false],["p13","Documents relatifs à la cessation du contrat de travail",false]];
const DEF_PARAMS={
  services:["Direction générale","Direction Administrative et Financière","Ressources humaines","Commercial","Communication","Production","Qualité / HSE","Magasin","Informatique","Logistique / Transport","Maintenance","Sécurité / Gardiennage"],
  categories:["Personnel administratif et d'encadrement","Agent d'exécution","Gardien","Chauffeur","Autre"],
  congeParMois:2.5, alerteContratJours:30, alerteVisiteJours:30, delaiRegulJours:15,
  typesConge:["Congé annuel","Permission exceptionnelle","Congé maladie","Congé maternité","Congé sans solde","Absence non justifiée","Mission"],
  nonPayes:["Congé sans solde","Absence non justifiée"]
};
const SERVICES_TACHES=["RH","Paie / DAF","HSE","Magasin","Informatique","Direction générale"];
const CONTRATS=["CDI","CDD","Journalier","Stage","Prestataire"];
const MAT_CATS=["Informatique","Téléphone","EPI","Tenue de travail","Outillage","Véhicule / engin","Mobilier","Autre"];
const MAT_ETATS=["Neuf","Bon","Usé","Hors service"];
const HSE_TYPES={visite:"Visite médicale",formation:"Formation HSE / hygiène",epi:"Dotation EPI",accident:"Accident / incident du travail"};
const VISITES=["Visite d'embauche","Visite périodique","Visite de reprise","Certificat d'aptitude manipulation des denrées"];
const VIEWS=[["tableau-de-bord","Tableau de bord"],["personnel","Personnel"],["dossiers","Dossiers incomplets"],["conges","Congés & absences"],["paie","Paie (lien DAF)"],["hse","HSE"],["materiel","Matériel"],["taches","Tâches inter-services"],["rapports","Rapports DG"],["parametres","Paramètres"]];

/* ================= ÉTAT ================= */
const COLS=["employes","conges","paie","hse","materiel","taches","journal","incidents"];
const S={params:{...DEF_PARAMS},loaded:{},canWrite:true,uid:null};
COLS.forEach(c=>S[c]=[]);
const API="https://zzycbxyefporwjztybix.supabase.co/functions/v1/rh-api";
let view="tableau-de-bord",TOKEN=null,VERSION="";
const ROLE_LIB={rh:"Responsable RH",assistant_secop:"Assistant RH SECOP",assistant_food:"Assistant RH FOOD",daf:"DAF",dg:"Direction générale"};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const role=()=>S.me?S.me.role:"";
const isAssist=()=>role().startsWith("assistant");
class ApiErr extends Error{constructor(m,st){super(m);this.status=st}}
async function api(action,payload){
  let r;try{r=await fetch(API,{method:"POST",headers:{"content-type":"application/json",...(TOKEN?{authorization:"Bearer "+TOKEN}:{})},body:JSON.stringify({action,payload:payload||{}})})}catch(e){throw new ApiErr("Connexion impossible au serveur. Vérifiez internet.",0)}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok||!j.ok){const m=j.error||"Erreur serveur.";if(r.status===401&&action!=="auth.login"){logout(m)}else if(r.status===428){showChangePw(true)}throw new ApiErr(m,r.status)}
  return j.data;
}
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const fd=iso=>iso?iso.split("-").reverse().join("/"):"";
const monthEnd=m=>m+"-"+String(new Date(+m.slice(0,4),+m.slice(5,7),0).getDate()).padStart(2,"0");
const curMonth=()=>todayISO().slice(0,7);
const fmtMonth=m=>{const [y,mo]=m.split("-");return ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][+mo-1]+" "+y};
const money=n=>(Math.round(+n||0)).toLocaleString("fr-FR").replace(/ /g," ")+" FCFA";
const num=n=>(+n||0).toLocaleString("fr-FR").replace(/ /g," ");
const emp=id=>S.employes.find(e=>e.id===id);
const nomE=e=>e?((e.nom||"").toUpperCase()+" "+(e.prenom||"")).trim():"—";
const nomId=id=>nomE(emp(id));
const actifs=()=>S.employes.filter(e=>e.actif!==false);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),3200)}

/* ================= RÈGLES MÉTIER ================= */
function piecesOblig(e){const k=PIECES.filter(p=>p[2]).map(p=>p[0]);if(e.actif===false)k.push("p13");return k}
function manquantes(e){const p=e.pieces||{};return piecesOblig(e).filter(k=>!(p[k]&&p[k].ok))}
function complet(e){return manquantes(e).length===0}
function tauxCompletude(list){const a=list.filter(e=>e.actif!==false);if(!a.length)return 0;return Math.round(a.filter(complet).length/a.length*1000)/10}
function pieceLabel(k){return (PIECES.find(p=>p[0]===k)||[k,k])[1]}
function joursPeriode(c){if(!c.debut||!c.fin)return 0;return Math.max(0,diffDays(c.debut,c.fin)+1)}
function soldeConge(e,annee){
  annee=annee||+todayISO().slice(0,4);
  const debutAnnee=annee+"-01-01",emb=e.dateEmbauche||debutAnnee;
  const depart=emb>debutAnnee?emb:debutAnnee;
  const fin=todayISO().slice(0,4)==String(annee)?todayISO():annee+"-12-31";
  let mois=0;if(fin>=depart){const a=new Date(depart+"T12:00:00"),b=new Date(fin+"T12:00:00");mois=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+(b.getDate()>=a.getDate()?1:0);mois=Math.max(0,Math.min(12,mois))}
  const acquis=Math.round(mois*(+S.params.congeParMois||0)*10)/10;
  const pris=S.conges.filter(c=>c.empId===e.id&&c.type==="Congé annuel"&&c.statut==="Validé"&&(c.debut||"").startsWith(String(annee))).reduce((s,c)=>s+(+c.jours||joursPeriode(c)),0);
  return {acquis,pris,solde:Math.round((acquis-pris)*10)/10};
}
function joursNonPayes(empId,mois){
  const d0=mois+"-01",dEnd=monthEnd(mois);
  return S.conges.filter(c=>c.empId===empId&&c.statut==="Validé"&&(S.params.nonPayes||[]).includes(c.type)&&c.debut<=dEnd&&c.fin>=d0)
    .reduce((s,c)=>{const a=c.debut>d0?c.debut:d0,b=c.fin<dEnd?c.fin:dEnd;return s+diffDays(a,b)+1},0);
}
function contratAlerte(e){if(e.actif===false||!e.dateFinContrat)return null;const j=diffDays(todayISO(),e.dateFinContrat);if(j<0)return {niv:"bad",j,txt:"Contrat échu depuis "+(-j)+" j"};if(j<=(+S.params.alerteContratJours||30))return {niv:"warn",j,txt:"Fin de contrat dans "+j+" j"};return null}
function derniereVisite(empId){return S.hse.filter(h=>h.type==="visite"&&h.empId===empId).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0]}
function hseAlertes(){
  if(role()==="daf")return [];
  const out=[],t=todayISO(),lim=+S.params.alerteVisiteJours||30;
  actifs().forEach(e=>{const v=derniereVisite(e.id);
    if(!v)out.push({niv:"warn",empId:e.id,txt:"Aucune visite médicale enregistrée"});
    else if(v.echeance){const j=diffDays(t,v.echeance);if(j<0)out.push({niv:"bad",empId:e.id,txt:"Visite médicale échue ("+fd(v.echeance)+")"});else if(j<=lim)out.push({niv:"warn",empId:e.id,txt:"Visite médicale à renouveler le "+fd(v.echeance)});}
    if(v&&v.resultat==="Inapte")out.push({niv:"bad",empId:e.id,txt:"Déclaré inapte : adapter le poste"});
  });
  S.hse.filter(h=>h.type==="formation"&&h.echeance&&emp(h.empId)&&emp(h.empId).actif!==false).forEach(h=>{const j=diffDays(t,h.echeance);if(j<0)out.push({niv:"bad",empId:h.empId,txt:"Recyclage échu : "+h.libelle});});
  return out;
}
function matNonRestitue(){return S.materiel.filter(m=>m.empId&&emp(m.empId)&&emp(m.empId).actif===false)}
function anomalies(){
  const out=[];
  actifs().forEach(e=>{
    if(e.typeContrat==="CDD"&&!e.dateFinContrat)out.push({empId:e.id,txt:"CDD sans date de fin"});
    const c=contratAlerte(e);if(c&&c.niv==="bad")out.push({empId:e.id,txt:c.txt+" alors que le salarié est actif"});
    ["telephone","poste","service","dateEmbauche"].forEach(k=>{if(!e[k])out.push({empId:e.id,txt:"Information manquante : "+({telephone:"téléphone",poste:"poste",service:"service",dateEmbauche:"date d'embauche"})[k]})});
    if(!e.salaireBase)out.push({empId:e.id,txt:"Salaire de base non renseigné (paie)"});
  });
  matNonRestitue().forEach(m=>out.push({empId:m.empId,txt:"Matériel non restitué après départ : "+m.designation}));

}

function upsertLocal(col,doc){if(col==="params"){if(doc.id==="general")S.params={...DEF_PARAMS,...doc};return}const L=S[col],i=L.findIndex(d=>d.id===doc.id);if(i>=0)L[i]=doc;else L.push(doc)}
async function save(col,id,data,isNew){
  data.updatedAt=new Date().toISOString();if(isNew){data.createdAt=data.updatedAt;data.par=S.uid||null}
  try{const r=await api("doc.save",{col,id:id||"",data,mode:isNew&&id?"set":"merge"});upsertLocal(col,r.doc);softRender();return r.id}
  catch(e){toast(e.message||"Enregistrement impossible.");throw e}
}

let empTab="infos";
function openEmp(id,tab){empTab=tab||empTab||"infos";const e=emp(id);if(!e)return;
  const tabs=[["infos","Informations"],["dossier","Pièces du dossier"],["conges","Congés"],["hse","HSE"],["materiel","Matériel"],["paie","Paie"],["historique","Historique"]];
  const m=manquantes(e),c=contratAlerte(e);
  openModal(`<div class="mhead"><div><h2 style="margin:0">${esc(nomE(e))}</h2><div class="muted small">${esc(e.matricule)} · ${esc(e.entite)} · ${esc(e.poste||"")} · ${esc(e.service||"")}</div></div>
   <div class="row">${e.actif===false?'<span class="pill p-n">Sorti</span>':'<span class="pill p-ok">Actif</span>'}${m.length?`<span class="pill p-warn">${m.length} pièce(s) manquante(s)</span>`:'<span class="pill p-ok">Dossier complet</span>'}${c?`<span class="pill p-${c.niv}">${esc(c.txt)}</span>`:""}<button class="btn sm" data-act="close">Fermer</button></div></div>
   <div class="tabs">${tabs.map(([k,l])=>`<button data-etab="${k}" class="${k===empTab?"on":""}">${l}</button>`).join("")}</div><div id="etab">${empTabHTML(e)}</div>`,true);
  $("#modal").dataset.emp=id;bindEmpTab(e);
}
function empTabHTML(e){
  const t=empTab;
  if(t==="infos")return formHTML(EMP_FIELDS,e)+`<div class="mfoot">${e.actif!==false?`<button class="btn dan" data-act="sortie" ${dis()}>Enregistrer un départ</button>`:`<button class="btn" data-act="reintegrer" ${dis()}>Réintégrer</button>`}<button class="btn pri" data-act="save-emp" ${dis()}>Enregistrer les modifications</button></div>`;
  if(t==="dossier"){const p=e.pieces||{},ob=piecesOblig(e);return `<p class="muted small">Cochez chaque pièce reçue et vérifiée (présence, lisibilité, cohérence). Indiquez où elle est classée (armoire, classeur, dossier numérique). Les pièces marquées * comptent pour la complétude.</p>
   <div class="pieces">${PIECES.map(([k,l])=>{const x=p[k]||{};return `<div class="piece ${x.ok?"ok":""}"><input type="checkbox" data-pk="${k}" ${x.ok?"checked":""} ${dis()} aria-label="${esc(l)}"><div>${esc(l)}${ob.includes(k)?" *":""}</div><input type="date" data-pd="${k}" value="${esc(x.date||"")}" ${dis()} aria-label="Date de réception"><input data-pe="${k}" placeholder="Classement (ex. Armoire 2 / SECOP)" value="${esc(x.emplacement||"")}" ${dis()} aria-label="Emplacement"></div>`}).join("")}</div>
   <div class="fsec" style="margin-top:14px">Documents médicaux</div><p class="muted small">Conformément à la procédure, les documents médicaux sont suivis séparément, dans l'onglet HSE, avec un accès limité.</p>
   <div class="mfoot"><button class="btn pri" data-act="save-pieces" ${dis()}>Enregistrer le dossier</button></div>`}
  if(t==="conges"){const s=soldeConge(e),L=S.conges.filter(c=>c.empId===e.id).sort((a,b)=>(b.debut||"").localeCompare(a.debut||""));return `<div class="grid g4" style="margin-bottom:12px"><div class="card kpi"><div class="v">${num(s.acquis)}</div><div class="l">Jours acquis ${todayISO().slice(0,4)}</div></div><div class="card kpi"><div class="v">${num(s.pris)}</div><div class="l">Jours de congé annuel pris</div></div><div class="card kpi ${s.solde<0?"stripe-bad":"stripe-ok"}"><div class="v">${num(s.solde)}</div><div class="l">Solde disponible</div></div></div>
   <div class="row" style="margin-bottom:8px"><button class="btn pri sm" data-act="new-conge" data-e="${e.id}" ${dis()}>+ Nouvelle demande</button></div>${congeTable(L,false)}`}
  if(t==="hse"){const L=S.hse.filter(h=>h.empId===e.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));return `<div class="row" style="margin-bottom:8px">${Object.entries(HSE_TYPES).map(([k,l])=>`<button class="btn sm" data-act="new-hse" data-t="${k}" data-e="${e.id}" ${dis()}>+ ${esc(l)}</button>`).join("")}</div>${hseTable(L,false)}`}
  if(t==="materiel"){const L=S.materiel.filter(m=>m.empId===e.id);return `<p class="muted small">Matériel actuellement remis au salarié (magasin et informatique).</p>${matTable(L)}<div class="mfoot"><a class="btn" href="#materiel" data-act="close">Aller au module Matériel</a></div>`}
  if(t==="paie"){const L=S.paie.filter(p=>p.empId===e.id).sort((a,b)=>b.mois.localeCompare(a.mois));return `<div class="kv" style="margin-bottom:12px"><div>Salaire de base</div><div><b>${money(e.salaireBase)}</b></div><div>Mode de paiement</div><div>${esc(e.modePaiement||"—")}</div><div>N° CNSS</div><div>${esc(e.numeroCNSS||"—")}</div></div>
   <div class="tbl-wrap"><table><tr><th>Mois</th><th class="num">Jours non payés</th><th class="num">Primes</th><th class="num">Heures sup.</th><th class="num">Avances</th><th class="num">Brut indicatif</th><th>Statut</th></tr>${L.map(p=>{const c=calcPaie(e,p);return `<tr><td>${fmtMonth(p.mois)}</td><td class="num">${c.jnp}</td><td class="num">${num(p.primes)}</td><td class="num">${num(p.montantHS)}</td><td class="num">${num(p.avances)}</td><td class="num">${money(c.brut)}</td><td>${pillStat(p.statut||"Brouillon")}</td></tr>`}).join("")||`<tr><td colspan="7"><div class="empty">Aucune variable de paie saisie.</div></td></tr>`}</table></div>`}
  if(t==="historique"){const L=S.journal.filter(j=>j.empId===e.id).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));return `<p class="muted small">Traçabilité des actes administratifs : chaque modification est enregistrée avec sa date.</p><div class="tbl-wrap"><table><tr><th>Date</th><th>Motif</th><th>Élément</th><th>Ancienne valeur</th><th>Nouvelle valeur</th></tr>${L.flatMap(j=>(j.changes||[]).map(c=>`<tr><td>${fd(j.date)}</td><td>${esc(j.motif)}</td><td>${esc(c.champ)}</td><td class="muted">${esc(c.ancien)}</td><td>${esc(c.nouveau)}</td></tr>`)).join("")||`<tr><td colspan="5"><div class="empty">Aucune modification enregistrée.</div></td></tr>`}</table></div>`}
  return "";
}
function bindEmpTab(e){$("#modal").querySelectorAll("[data-etab]").forEach(b=>b.onclick=()=>{empTab=b.dataset.etab;openEmp(e.id)})}
async function saveEmp(id){
  if(!checkForm())return;const e=emp(id),d=readForm(EMP_FIELDS),ch=[];
  EMP_FIELDS.forEach(f=>{if(f[0]==="sec")return;const a=e[f[0]]??"",b=d[f[0]]??"";if(String(a)!==String(b))ch.push({champ:f[1].replace(/ \(.*\)$/,""),ancien:f[2]==="date"?fd(a):String(a),nouveau:f[2]==="date"?fd(b):String(b)})});
  if(!ch.length){toast("Aucune modification.");return}
  try{await save("employes",id,d);await logJournal(id,ch,"Mise à jour");const tt=tachesMutation({...e,...d},ch);await creerTaches(tt);toast("Modifications enregistrées"+(tt.length?" · "+tt.length+" tâche(s) envoyée(s) aux services":""));openEmp(id)}catch(err){}
}
async function savePieces(id){
  const e=emp(id),old=e.pieces||{},p={},ch=[];
  PIECES.forEach(([k,l])=>{const ok=$(`[data-pk="${k}"]`).checked,date=$(`[data-pd="${k}"]`).value,emplacement=$(`[data-pe="${k}"]`).value.trim();
    p[k]={ok,date:ok&&!date?todayISO():date,emplacement};if(!!(old[k]&&old[k].ok)!==ok)ch.push({champ:l,ancien:old[k]&&old[k].ok?"Reçue":"Manquante",nouveau:ok?"Reçue":"Manquante"})});
  const upd={pieces:p};const tmp={...e,pieces:p};
  if(complet(tmp)&&e.regul&&e.regul.statut==="En cours de régularisation")upd.regul={...e.regul,statut:"Régularisé",dateRegul:todayISO()};
  try{await save("employes",id,upd);await logJournal(id,ch,"Dossier individuel");toast(complet(tmp)?"Dossier complet ✔":"Dossier enregistré : "+manquantes(tmp).length+" pièce(s) obligatoire(s) manquante(s)");openEmp(id)}catch(err){}
}
function sortieForm(id){const e=emp(id);openModal(`<div class="mhead"><h2>Départ de ${esc(nomE(e))}</h2><button class="btn sm" data-act="close">Fermer</button></div>
  <form class="form" id="frm"><label>Date de sortie *<input type="date" name="dateSortie" required value="${todayISO()}"></label><label>Motif *<select name="motifSortie" required>${opts(["Fin de contrat","Démission","Licenciement","Retraite","Abandon de poste","Décès","Autre"])}</select></label><label class="full">Observations<textarea name="obs"></textarea></label></form>
  <p class="muted small">À l'enregistrement : Magasin et Informatique reçoivent la liste du matériel à récupérer, la DAF le solde de tout compte, le RH le certificat de travail. La pièce « cessation du contrat » devient obligatoire.</p>
  <div class="mfoot"><button class="btn" data-act="close">Annuler</button><button class="btn dan" data-act="save-sortie" data-e="${id}">Confirmer le départ</button></div>`)}
async function saveSortie(id){if(!checkForm())return;const fr=$("#frm"),e=emp(id);const d={actif:false,dateSortie:fr.dateSortie.value,motifSortie:fr.motifSortie.value,obsSortie:fr.obs.value};
  try{await save("employes",id,d);await logJournal(id,[{champ:"Départ",ancien:"Actif",nouveau:d.motifSortie+" le "+fd(d.dateSortie)}],"Départ");await creerTaches(tachesSortie({...e,...d}));closeModal();toast("Départ enregistré. Tâches envoyées au Magasin, à l'Informatique, à la DAF et au RH.")}catch(err){}}

/* ---------- DOSSIERS INCOMPLETS ---------- */
R.dossiers=()=>{
  const L=actifs().concat(S.employes.filter(e=>e.actif===false&&!complet(e))).filter(e=>!complet(e)).sort((a,b)=>manquantes(b).length-manquantes(a).length);
  const t=todayISO();const dem=S.employes.filter(e=>e.regul&&e.regul.dateDemande),reg=dem.filter(e=>e.regul.statut==="Régularisé"||complet(e));
  return head("Suivi des dossiers incomplets",`${L.length} dossier(s) incomplet(s) · taux de régularisation ${dem.length?Math.round(reg.length/dem.length*100):0} % (${reg.length}/${dem.length} dossiers relancés)`,`<button class="btn" data-act="export-incomplets">Exporter Excel</button>`)+
  `<div class="tbl-wrap"><table><tr><th>Nom et prénom</th><th>Entité</th><th>Service</th><th>Pièces manquantes</th><th>Demande de régularisation</th><th>Délai</th><th>Relances</th><th>Statut</th><th></th></tr>
  ${L.map(e=>{const r=e.regul||{},late=r.delai&&r.delai<t;return `<tr><td><a href="#" data-open="${e.id}"><b>${esc(nomE(e))}</b></a></td><td>${esc(e.entite)}</td><td>${esc(e.service)}</td><td class="small">${manquantes(e).map(pieceLabel).map(esc).join("<br>")}</td><td>${fd(r.dateDemande)||'<span class="muted">—</span>'}</td><td>${r.delai?`<span class="pill ${late?"p-bad":"p-n"}">${fd(r.delai)}${late?" · dépassé":""}</span>`:"—"}</td><td class="num">${(r.relances||[]).length}</td><td>${pillStat(r.statut||"Non demandé")}</td>
   <td><button class="btn sm" data-act="relance" data-e="${e.id}" ${dis()}>${r.dateDemande?"Relancer":"Demander"}</button></td></tr>`}).join("")||`<tr><td colspan="9"><div class="empty">Tous les dossiers sont complets.</div></td></tr>`}</table></div>
  <p class="muted small" style="margin-top:10px">« Demander » enregistre la date de demande et fixe le délai (${S.params.delaiRegulJours} jours, modifiable dans Paramètres). « Relancer » ajoute une relance. Le message à transmettre au salarié est copié dans le presse-papiers.</p>`;
};
async function relance(id){const e=emp(id),r={...(e.regul||{})},t=todayISO();
  if(!r.dateDemande){r.dateDemande=t;r.delai=addDays(t,+S.params.delaiRegulJours||15);r.relances=[];}else{r.relances=[...(r.relances||[]),t];}
  r.statut="En cours de régularisation";
  const msg=`Bonjour ${e.prenom||""} ${e.nom||""},\nLe service RH vous prie de fournir les pièces suivantes pour compléter votre dossier administratif, avant le ${fd(r.delai)} :\n- ${manquantes(e).map(pieceLabel).join("\n- ")}\nMerci.\nService des Ressources Humaines`;
  try{await save("employes",id,{regul:r});await logJournal(id,[{champ:"Régularisation",ancien:"",nouveau:(r.relances.length?"Relance n°"+r.relances.length:"Demande")+" · délai "+fd(r.delai)}],"Dossier incomplet");
   try{await navigator.clipboard.writeText(msg);toast("Enregistré. Message de relance copié : collez-le dans un SMS ou WhatsApp.")}catch(x){toast("Relance enregistrée.")}}catch(err){}}

/* ---------- CONGÉS ---------- */
let fC={st:"",mois:""};
function congeTable(L,showEmp){return `<div class="tbl-wrap"><table><tr>${showEmp?"<th>Salarié</th>":""}<th>Type</th><th>Du</th><th>Au</th><th class="num">Jours</th><th>Motif</th><th>Statut</th><th>Paie</th><th></th></tr>
 ${L.map(c=>`<tr>${showEmp?`<td><a href="#" data-open="${c.empId}">${esc(nomId(c.empId))}</a></td>`:""}<td>${esc(c.type)}</td><td>${fd(c.debut)}</td><td>${fd(c.fin)}</td><td class="num">${num(c.jours||joursPeriode(c))}</td><td class="small">${esc(c.motif)}</td><td>${pillStat(c.statut)}</td><td>${(S.params.nonPayes||[]).includes(c.type)?'<span class="pill p-warn">Retenue</span>':'<span class="muted small">Payé</span>'}</td>
 <td><div class="row nw">${c.statut==="En attente"?`<button class="btn sm acc" data-act="conge-ok" data-id="${c.id}" ${dis()}>Valider</button><button class="btn sm dan" data-act="conge-ko" data-id="${c.id}" ${dis()}>Refuser</button>`:""}<button class="btn sm" data-act="edit-conge" data-id="${c.id}" ${dis()}>Modifier</button></div></td></tr>`).join("")||`<tr><td colspan="9"><div class="empty">Aucune demande.</div></td></tr>`}</table></div>`}
R.conges=()=>{
  const L=S.conges.filter(c=>(!fC.st||c.statut===fC.st)&&(!fC.mois||(c.debut||"").slice(0,7)<=fC.mois&&(c.fin||"").slice(0,7)>=fC.mois)).sort((a,b)=>(b.debut||"").localeCompare(a.debut||""));
  return head("Congés et absences","Les absences non payées (congé sans solde, absence non justifiée) sont reportées automatiquement dans la paie du mois.",`<button class="btn" data-act="export-conges">Exporter Excel</button><button class="btn pri" data-act="new-conge" ${dis()}>+ Nouvelle demande</button>`)+
  `<div class="row" style="margin-bottom:12px"><select id="cst" aria-label="Statut"><option value="">Tous statuts</option>${opts(["En attente","Validé","Refusé"],fC.st)}</select><label class="row small muted" for="cm">Mois <input type="month" id="cm" value="${fC.mois}"></label></div>`+congeTable(L,true)+
  `<h2 style="margin-top:20px">Soldes de congé annuel ${todayISO().slice(0,4)}</h2><div class="tbl-wrap"><table><tr><th>Salarié</th><th>Entité</th><th class="num">Acquis</th><th class="num">Pris</th><th class="num">Solde</th></tr>${actifs().sort((a,b)=>nomE(a).localeCompare(nomE(b))).map(e=>{const s=soldeConge(e);return `<tr><td>${esc(nomE(e))}</td><td>${esc(e.entite)}</td><td class="num">${num(s.acquis)}</td><td class="num">${num(s.pris)}</td><td class="num"><b style="${s.solde<0?"color:var(--bad)":""}">${num(s.solde)}</b></td></tr>`}).join("")}</table></div><p class="muted small">Calcul : ${num(S.params.congeParMois)} jours par mois de présence dans l'année (paramétrable).</p>`;
};
A.conges=()=>{$("#cst").onchange=e=>{fC.st=e.target.value;render()};$("#cm").onchange=e=>{fC.mois=e.target.value;render()}};
function congeForm(c,empId){c=c||{};const isNew=!c.id;
  openModal(`<div class="mhead"><h2>${isNew?"Nouvelle demande":"Modifier la demande"}</h2><button class="btn sm" data-act="close">Fermer</button></div>
  <form class="form" id="frm"><label class="full">Salarié *<select name="empId" required>${empOptions(c.empId||empId)}</select></label>
  <label>Type *<select name="type" required>${opts(S.params.typesConge,c.type)}</select></label><label>Statut<select name="statut">${opts(["En attente","Validé","Refusé"],c.statut||"En attente")}</select></label>
  <label>Du *<input type="date" name="debut" required value="${esc(c.debut||todayISO())}"></label><label>Au *<input type="date" name="fin" required value="${esc(c.fin||todayISO())}"></label>
  <label>Nombre de jours<input type="number" step="0.5" name="jours" value="${esc(c.jours||"")}" placeholder="calculé si vide"></label><label class="full">Motif / justificatif<textarea name="motif">${esc(c.motif||"")}</textarea></label></form>
  <div class="mfoot">${!isNew?`<button class="btn dan" data-act="del-conge" data-id="${c.id}">Supprimer</button>`:""}<button class="btn" data-act="close">Annuler</button><button class="btn pri" data-act="save-conge" data-id="${c.id||""}">Enregistrer</button></div>`)}
async function saveConge(id){if(!checkForm())return;const f=$("#frm");const d={empId:f.empId.value,type:f.type.value,statut:f.statut.value,debut:f.debut.value,fin:f.fin.value,motif:f.motif.value.trim()};
  if(d.fin<d.debut){toast("La date de fin est avant la date de début.");return}
  d.jours=f.jours.value?+f.jours.value:joursPeriode(d);if(d.statut==="Validé")d.valideLe=todayISO();
  try{const nid=await save("conges",id||null,d,!id);await afterConge({...d,id:nid});closeModal();toast("Demande enregistrée")}catch(e){}}
async function afterConge(c){if(c.statut==="Validé"&&(S.params.nonPayes||[]).includes(c.type)){await creerTaches([{titre:`Retenue sur salaire : ${c.type.toLowerCase()} de ${nomId(c.empId)} du ${fd(c.debut)} au ${fd(c.fin)} (${c.jours} j)`,service:"Paie / DAF",empId:c.empId,evenement:"Absence",echeance:addDays(todayISO(),5)}])}}
async function congeStatut(id,st){const c=S.conges.find(x=>x.id===id);try{await save("conges",id,{statut:st,valideLe:todayISO()});if(st==="Validé")await afterConge({...c,statut:st});toast("Demande "+st.toLowerCase())}catch(e){}}

/* ---------- PAIE ---------- */
let paieMois=curMonth();const draft={};
function dv(empId,f,p){const d=draft[paieMois+"_"+empId];return d&&f in d?d[f]:(p[f]??"")}
function calcPaie(e,p){p=p||{};const base=+e.salaireBase||0,jnp=p.joursNonPayes!==undefined&&p.joursNonPayes!==""?+p.joursNonPayes:joursNonPayes(e.id,p.mois||paieMois);
  const ret=Math.round(base/30*jnp);const brut=base-ret+(+p.primes||0)+(+p.montantHS||0);return {base,jnp,ret,brut,netAvant:brut-(+p.avances||0)-(+p.autresRetenues||0)}}
function paieRows(){const d0=paieMois+"-01",dEnd=monthEnd(paieMois);
  return S.employes.filter(e=>(e.dateEmbauche||"")<=dEnd&&(e.actif!==false||(e.dateSortie||"")>=d0)).sort((a,b)=>(a.entite+nomE(a)).localeCompare(b.entite+nomE(b))).map(e=>{const p=S.paie.find(x=>x.id===paieMois+"_"+e.id)||{mois:paieMois};return {e,p,c:calcPaie(e,p),entree:(e.dateEmbauche||"")>=d0?e.dateEmbauche:"",sortie:e.actif===false?e.dateSortie:""}})}
R.paie=()=>{const rows=paieRows(),tot=rows.reduce((s,r)=>s+r.c.brut,0),st=rows.length&&rows.every(r=>(r.p.statut||"Brouillon")!=="Brouillon")?rows[0].p.statut:"Brouillon";
  return head("Variables de paie","Préparées par le RH, transmises à la DAF. Le RH ne calcule pas les cotisations ni l'impôt : la DAF établit les bulletins.",`<input type="month" id="pm" value="${paieMois}" aria-label="Mois de paie"><button class="btn" data-act="export-paie">Exporter Excel</button>${role()==="daf"?`<button class="btn acc" data-act="valider-daf">Valider la paie du mois (DAF)</button>`:`<button class="btn acc" data-act="transmettre" ${dis()}>Transmettre à la DAF</button>`}`)+
  `<div class="grid g4" style="margin-bottom:14px"><div class="card kpi stripe-brand"><div class="v">${rows.length}</div><div class="l">Salariés à payer · ${fmtMonth(paieMois)}</div></div><div class="card kpi"><div class="v">${num(rows.reduce((s,r)=>s+r.c.jnp,0))}</div><div class="l">Jours d'absence non payés</div></div><div class="card kpi"><div class="v" style="font-size:24px">${money(tot)}</div><div class="l">Masse brute indicative</div></div><div class="card kpi"><div class="v" style="font-size:22px">${pillStat(st)}</div><div class="l">Statut du mois</div></div></div>
  <div class="tbl-wrap"><table><tr><th>Matricule</th><th>Salarié</th><th>Mouvement</th><th class="num">Salaire de base</th><th class="num">Jours non payés</th><th class="num">Retenue absence</th><th class="num">Primes</th><th class="num">Heures sup. (FCFA)</th><th class="num">Avances</th><th class="num">Autres retenues</th><th class="num">Brut indicatif</th><th>Statut</th><th></th></tr>
  ${rows.map(({e,p,c,entree,sortie})=>`<tr data-prow="${e.id}"><td>${esc(e.matricule)}</td><td><b>${esc(nomE(e))}</b><div class="muted small">${esc(e.entite)} · ${esc(e.poste||"")}</div></td><td class="small">${entree?`<span class="pill p-b">Entrée ${fd(entree)}</span>`:""}${sortie?`<span class="pill p-warn">Sortie ${fd(sortie)}</span>`:""}</td><td class="num">${num(c.base)}</td>
   <td><input type="number" step="0.5" min="0" data-f="joursNonPayes" value="${esc(dv(e.id,"joursNonPayes",p))}" placeholder="${joursNonPayes(e.id,paieMois)}" ${dis()} aria-label="Jours non payés"></td><td class="num">${num(c.ret)}</td>

async function importFile(file){const res=$("#impres");if(!file)return;res.textContent="Lecture du fichier…";

      const d={nom:nom.toUpperCase(),prenom,entite:ent,service:String(g(r,"Service")).trim(),poste:String(g(r,"Poste")).trim(),categorie:String(g(r,"Catégorie")||g(r,"Categorie")).trim(),statutEmploi:String(g(r,"Statut")).trim()||"Permanent",typeContrat:String(g(r,"Contrat")).trim()||"CDI",dateEmbauche:parseDate(g(r,"Date d'embauche")),dateFinContrat:parseDate(g(r,"Fin de contrat")),telephone:String(g(r,"Téléphone")||g(r,"Telephone")).trim(),adresse:String(g(r,"Adresse")).trim(),situationFamiliale:String(g(r,"Situation")).trim(),nbEnfants:g(r,"Nombre d'enfants")===""?"":+g(r,"Nombre d'enfants"),numeroCNSS:String(g(r,"N° CNSS")).trim(),salaireBase:g(r,"Salaire")===""?"":+String(g(r,"Salaire")).replace(/\s/g,""),actif:true,pieces:{},regul:{statut:"Non demandé"}};
      d.matricule=nouveauMatricule(ent);

    res.innerHTML=`<b>${ok}</b> salarié(s) importé(s), ${skip} déjà présent(s).${err.length?"<br>"+err.map(esc).join("<br>"):""}`;
  }catch(e){res.textContent="Fichier illisible. Utilisez le modèle Excel."}}

  const busy=fn=>async()=>{b.disabled=true;try{await fn()}finally{b.disabled=false}};
  const M={
    "close":closeModal,"new-emp":newEmp,"save-new-emp":busy(saveNewEmp),"save-emp":busy(()=>saveEmp(me)),"save-pieces":busy(()=>savePieces(me)),
    "sortie":()=>sortieForm(me),"save-sortie":busy(()=>saveSortie(b.dataset.e)),"reintegrer":busy(async()=>{await save("employes",me,{actif:true,dateSortie:"",motifSortie:""});await logJournal(me,[{champ:"Réintégration",ancien:"Sorti",nouveau:"Actif"}],"Réintégration");openEmp(me)}),
    "relance":busy(()=>relance(b.dataset.e)),
    "new-conge":()=>congeForm(null,b.dataset.e),"edit-conge":()=>congeForm(S.conges.find(c=>c.id===id)),"save-conge":busy(()=>saveConge(id)),"del-conge":busy(async()=>{await del("conges",id);closeModal()}),
    "conge-ok":busy(()=>congeStatut(id,"Validé")),"conge-ko":busy(()=>congeStatut(id,"Refusé")),
    "save-paie":busy(()=>savePaie(b.dataset.e)),"transmettre":busy(transmettre),"valider-daf":busy(validerDaf),
    "logout":()=>logout(),"change-pw":()=>showChangePw(false),"new-user":()=>userForm(),"edit-user":()=>userForm(USERS.find(u=>u.id===id)),"save-user":busy(()=>saveUser(id)),
    "reset-pw":()=>resetPwForm(id),"save-reset":busy(()=>saveReset(id)),"user-statut":busy(async()=>{try{await api("users.set_statut",{id,statut:b.dataset.s});toast("Compte mis à jour");loadUsers()}catch(e){toast(e.message)}}),
    "new-hse":()=>hseForm(null,b.dataset.t,b.dataset.e),"edit-hse":()=>hseForm(S.hse.find(h=>h.id===id)),"save-hse":busy(()=>saveHse(id)),"del-hse":busy(async()=>{await del("hse",id);closeModal()}),
    "new-mat":()=>matForm(),"edit-mat":()=>matForm(S.materiel.find(m=>m.id===id)),"save-mat":busy(()=>saveMat(id)),"del-mat":busy(async()=>{await del("materiel",id);closeModal()}),
    "affecter":()=>affecterForm(id),"save-affect":busy(()=>saveAffect(id)),"restituer":()=>restituerForm(id),"save-restit":busy(()=>saveRestit(id)),
    "new-tache":tacheForm,"save-tache":busy(async()=>{if(!checkForm())return;const f=$("#frm");await creerTaches([{titre:f.titre.value.trim(),service:f.service.value,echeance:f.echeance.value,empId:f.empId.value,evenement:"Manuelle"}]);closeModal();toast("Tâche envoyée au service "+f.service.value)}),
    "tache-st":busy(async()=>{await save("taches",id,{statut:b.dataset.s,faitLe:b.dataset.s==="Fait"?todayISO():""})}),"del-tache":busy(()=>del("taches",id)),
    "new-incident":()=>incidentForm(),"edit-incident":()=>incidentForm(S.incidents.find(i=>i.id===id)),
    "save-incident":busy(async()=>{if(!checkForm())return;const f=$("#frm"),d={date:f.date.value,type:f.type.value,statut:f.statut.value,description:f.description.value.trim(),mesures:f.mesures.value.trim()};await save("incidents",id||null,d,!id);if(!id)await creerTaches([{titre:"Incident documentaire signalé ("+d.type+") le "+fd(d.date)+" : prendre connaissance et valider les mesures",service:"Direction générale",evenement:"Incident",echeance:addDays(todayISO(),3)}]);closeModal();toast("Incident enregistré")}),
    "save-params":busy(async()=>{const f=$("#frm"),L=k=>f[k].value.split("\n").map(s=>s.trim()).filter(Boolean);const d={congeParMois:+f.congeParMois.value||0,alerteContratJours:+f.alerteContratJours.value||30,alerteVisiteJours:+f.alerteVisiteJours.value||30,delaiRegulJours:+f.delaiRegulJours.value||15,services:L("services"),categories:L("categories"),typesConge:L("typesConge"),nonPayes:L("nonPayes")};await save("params","general",d,true);toast("Paramètres enregistrés")}),
    "modele":modele,"import":()=>$("#fileIn").click(),
    "backup":()=>saveXlsx("Sauvegarde_ERP_RH_"+todayISO()+".xlsx",[["Personnel",rowsPersonnel(S.employes)],["Dossiers incomplets",rowsIncomplets()],["Congés",rowsConges()],["Paie "+paieMois,rowsPaie()],["HSE",rowsHse()],["Matériel",rowsMat()],["Tâches",rowsTaches()],["Historique",S.journal.flatMap(j=>(j.changes||[]).map(c=>({"Date":fd(j.date),"Salarié":nomId(j.empId),"Motif":j.motif,"Élément":c.champ,"Ancien":c.ancien,"Nouveau":c.nouveau})))],["Incidents",S.incidents.map(i=>({"Date":fd(i.date),"Type":i.type,"Description":i.description,"Mesures":i.mesures,"Statut":i.statut}))]]),
    "export-personnel":()=>saveXlsx("Registre_personnel_"+todayISO()+".xlsx",[["Registre du personnel",rowsPersonnel(S.employes)]]),
    "export-incomplets":()=>saveXlsx("Dossiers_incomplets_"+todayISO()+".xlsx",[["Dossiers incomplets",rowsIncomplets()]]),
    "export-conges":()=>saveXlsx("Conges_absences_"+todayISO()+".xlsx",[["Congés et absences",rowsConges()]]),
    "export-paie":()=>saveXlsx("Variables_paie_"+paieMois+".xlsx",[["Variables de paie",rowsPaie()]]),
    "export-hse":()=>saveXlsx("Suivi_HSE_"+todayISO()+".xlsx",[["HSE",rowsHse()],["Alertes",hseAlertes().map(a=>({"Salarié":nomId(a.empId),"Alerte":a.txt}))]]),
    "export-mat":()=>saveXlsx("Materiel_"+todayISO()+".xlsx",[["Matériel",rowsMat()]]),
    "export-taches":()=>saveXlsx("Taches_inter_services_"+todayISO()+".xlsx",[["Tâches",rowsTaches()]]),
    "export-rapport":exportRapport,
    "purge-demo":busy(async()=>{for(const c of COLS)for(const d of S[c].filter(x=>x.demo)){try{await del(c,d.id)}catch(e){return}}toast("Exemples supprimés : l'ERP est prêt pour vos données.")})
  };
  if(M[a])await M[a]();
});
$("#fileIn").addEventListener("change",e=>{importFile(e.target.files[0]);e.target.value=""});

/* ================= ROUTAGE / INIT ================= */
function route(){const h=location.hash.slice(1);view=visibleViews().some(v=>v[0]===h)?h:"tableau-de-bord";if($("#ov").classList.contains("open"))$("#ov").classList.remove("open");render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
route();
/* ================= CONNEXION ================= */
function authScreen(html){$("#authbox").innerHTML=`<div class="authlogo"></div>`+html;$("#auth").classList.add("open");const f=$("#authbox").querySelector("input");f&&f.focus()}
function showLogin(msg){authScreen(`<h1>ERP RH</h1><div class="sub" style="margin-bottom:16px">SECOP &amp; FOOD · Gestion administrative du personnel</div>
  <form class="form" id="flogin"><label for="li">Identifiant<input id="li" autocomplete="username" required></label><label for="lp">Mot de passe<input id="lp" type="password" autocomplete="current-password" required></label>
  <button class="btn pri" type="submit">Se connecter</button></form><div class="err" id="lerr">${esc(msg||"")}</div><p class="muted small">Mot de passe oublié : demandez une réinitialisation au Responsable RH.</p>`);
  $("#flogin").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";const bt=e.target.querySelector("button");bt.disabled=true;
    try{const r=await api("auth.login",{identifiant:$("#li").value,password:$("#lp").value});await startSession(r)}catch(x){$("#lerr").textContent=x.message}finally{bt.disabled=false}}}
function showSetup(){authScreen(`<h1>Première mise en service</h1><div class="sub" style="margin-bottom:14px">Aucun compte n'existe encore. Créez le compte du <b>Responsable RH</b> : il créera ensuite les comptes des assistants RH, de la DAF et de la DG.</div>
  <form class="form" id="fsetup"><label>Nom *<input name="nom" required></label><label>Prénom<input name="prenom"></label><label>Identifiant de connexion *<input name="username" required placeholder="ex. resp.rh" autocomplete="username"></label><label>Mot de passe * (8 caractères min., lettres et chiffres)<input name="password" type="password" required autocomplete="new-password"></label><label>Confirmer le mot de passe *<input name="password2" type="password" required autocomplete="new-password"></label>
  <button class="btn pri" type="submit">Créer le compte et entrer</button></form><div class="err" id="lerr"></div>`);
  $("#fsetup").onsubmit=async e=>{e.preventDefault();const f=e.target;if(f.password.value!==f.password2.value){$("#lerr").textContent="Les deux mots de passe sont différents.";return}
    try{const r=await api("setup.first",{user:{nom:f.nom.value,prenom:f.prenom.value,username:f.username.value,password:f.password.value}});await startSession(r)}catch(x){$("#lerr").textContent=x.message}}}
function showChangePw(force){authScreen(`<h1>${force?"Choisissez votre mot de passe":"Changer mon mot de passe"}</h1><div class="sub" style="margin-bottom:14px">${force?"Votre compte a un mot de passe provisoire. Choisissez-en un personnel pour continuer.":"8 caractères minimum, avec des lettres et des chiffres."}</div>
  <form class="form" id="fpw"><label>Mot de passe actuel<input name="ancien" type="password" required autocomplete="current-password"></label><label>Nouveau mot de passe<input name="nouveau" type="password" required autocomplete="new-password"></label><label>Confirmer<input name="n2" type="password" required autocomplete="new-password"></label>
  <button class="btn pri" type="submit">Enregistrer</button>${force?"":`<button class="btn" type="button" id="pwcancel">Annuler</button>`}</form><div class="err" id="lerr"></div>`);
  if(!force)$("#pwcancel").onclick=()=>$("#auth").classList.remove("open");
  $("#fpw").onsubmit=async e=>{e.preventDefault();const f=e.target;if(f.nouveau.value!==f.n2.value){$("#lerr").textContent="Les deux mots de passe sont différents.";return}
    try{const r=await api("auth.change_password",{ancien:f.ancien.value,nouveau:f.nouveau.value});toast("Mot de passe modifié");await startSession(r)}catch(x){$("#lerr").textContent=x.message}}}
function logout(msg){TOKEN=null;lsSet("rh_token",null);S.me=null;COLS.forEach(c=>S[c]=[]);clearInterval(S._poll);$("#ov").classList.remove("open");$("#main").innerHTML="";showLogin(msg)}
async function startSession(r){
  TOKEN=r.token;lsSet("rh_token",TOKEN);S.me=r.user;S.uid=r.user.id;
  if(r.user.must_change_password){showChangePw(true);return}
  S.canWrite=["rh","assistant_secop","assistant_food"].includes(r.user.role);
  $("#who").innerHTML=`<b>${esc([r.user.prenom,r.user.nom].filter(Boolean).join(" "))}</b>${esc(r.user.role_nom)}<button class="btn sm" data-act="change-pw">Mot de passe</button><button class="btn sm" data-act="logout">Déconnexion</button>`;
  $("#auth").classList.remove("open");$("#main").innerHTML=`<div class="empty">Chargement des données…</div>`;
  await loadAll();route();
  clearInterval(S._poll);S._poll=setInterval(async()=>{if(document.hidden||!TOKEN)return;try{const v=await api("data.version");if(v.version!==VERSION)await loadAll(true)}catch(e){}},30000);
}
async function loadAll(soft){
  try{const d=await api("data.load");VERSION=d.version;COLS.forEach(c=>S[c]=d.docs[c]||[]);const pr=(d.docs.params||[]).find(x=>x.id==="general");S.params=pr?{...DEF_PARAMS,...pr}:{...DEF_PARAMS};S.loaded.all=1;soft?softRender():render()}
  catch(e){if(e.status!==401)toast(e.message)}
}
document.addEventListener("visibilitychange",async()=>{if(!document.hidden&&TOKEN){try{const v=await api("data.version");if(v.version!==VERSION)await loadAll(true)}catch(e){}}});

/* ================= UTILISATEURS ================= */
let USERS=[],JOURNAL=[];
async function loadUsers(){try{const [u,j]=await Promise.all([api("users.list"),api("users.journal")]);USERS=u.users;JOURNAL=j.rows;if(view==="utilisateurs")render()}catch(e){toast(e.message)}}
R.utilisateurs=()=>{if(role()!=="rh")return "";if(!R.utilisateurs._l){R.utilisateurs._l=1;loadUsers()}
  return head("Utilisateurs","Comptes propres à l'ERP RH, distincts des ERP Gestion commerciale et Veille. Chaque personne choisit son mot de passe à sa première connexion.",`<button class="btn pri" data-act="new-user">+ Nouveau compte</button>`)+
  `<div class="grid g2" style="margin-bottom:14px"><div class="card"><h2>Profils et droits</h2><div class="kv small">
   <div>Responsable RH</div><div>Tout l'ERP, SECOP et FOOD, paramètres et comptes.</div>
   <div>Assistant RH SECOP</div><div>Saisie et suivi du personnel SECOP uniquement (dossiers, congés, paie, HSE, matériel, tâches).</div>
   <div>Assistant RH FOOD</div><div>Saisie et suivi du personnel FOOD uniquement.</div>
   <div>DAF</div><div>Consultation (hors dossiers médicaux HSE), validation des variables de paie, tâches Paie / DAF.</div>
   <div>Direction générale</div><div>Consultation de tout l'ERP et des rapports, tâches de la Direction générale.</div></div></div>
   <div class="card"><h2>Dernières connexions et actions</h2><div style="max-height:260px;overflow:auto">${JOURNAL.slice(0,40).map(j=>`<div class="alert"><span class="dot d-${/ECHEC/.test(j.action)?"bad":"b"}"></span><div class="small"><b>${esc(j.user_nom)}</b> · ${esc(j.action.toLowerCase().replace(/_/g," "))}${j.objet&&j.objet!=="utilisateurs"?" · "+esc(j.objet):""}<div class="muted">${new Date(j.at).toLocaleString("fr-FR")}</div></div></div>`).join("")||'<div class="muted">Aucune activité.</div>'}</div></div></div>
  <div class="tbl-wrap"><table><tr><th>Nom</th><th>Identifiant</th><th>Profil</th><th>Téléphone</th><th>Statut</th><th>Dernière connexion</th><th></th></tr>${USERS.map(u=>`<tr><td><b>${esc([u.prenom,u.nom].filter(Boolean).join(" "))}</b></td><td>${esc(u.username)}</td><td><span class="pill p-b">${esc(u.role_nom)}</span></td><td>${esc(u.telephone||"")}</td><td>${u.statut==="actif"?(u.must_change_password?'<span class="pill p-warn">Mot de passe provisoire</span>':'<span class="pill p-ok">Actif</span>'):'<span class="pill p-bad">Suspendu</span>'}${u.verrouille?' <span class="pill p-bad">Verrouillé</span>':""}</td><td class="small">${u.last_login?new Date(u.last_login).toLocaleString("fr-FR"):"Jamais"}</td>
   <td><div class="row nw"><button class="btn sm" data-act="edit-user" data-id="${u.id}">Modifier</button>${u.id!==S.uid?`<button class="btn sm" data-act="reset-pw" data-id="${u.id}">Réinitialiser</button><button class="btn sm ${u.statut==="actif"?"dan":"acc"}" data-act="user-statut" data-id="${u.id}" data-s="${u.statut==="actif"?"suspendu":"actif"}">${u.statut==="actif"?"Suspendre":"Réactiver"}</button>`:""}</div></td></tr>`).join("")||`<tr><td colspan="7"><div class="empty">Chargement…</div></td></tr>`}</table></div>`};
function userForm(u){u=u||{};const isNew=!u.id;openModal(`<div class="mhead"><h2>${isNew?"Nouveau compte":"Modifier le compte"}</h2><button class="btn sm" data-act="close">Fermer</button></div>
  <form class="form" id="frm"><label>Nom *<input name="nom" required value="${esc(u.nom||"")}"></label><label>Prénom<input name="prenom" value="${esc(u.prenom||"")}"></label>
  <label>Profil *<select name="role" required>${Object.entries(ROLE_LIB).map(([k,l])=>`<option value="${k}" ${u.role===k?"selected":""}>${l}</option>`).join("")}</select></label><label>Téléphone<input name="telephone" value="${esc(u.telephone||"")}"></label>
  ${isNew?`<label>Identifiant de connexion *<input name="username" required placeholder="ex. assistant.food"></label><label>E-mail (facultatif)<input name="email" type="email"></label><label class="full">Mot de passe provisoire * (8 caractères min., lettres et chiffres)<input name="password" required value="${mdpProvisoire()}"></label>`:""}</form>
  ${isNew?'<p class="muted small">Communiquez l\'identifiant et le mot de passe provisoire à la personne : elle devra le changer à sa première connexion.</p>':""}
  <div class="mfoot"><button class="btn" data-act="close">Annuler</button><button class="btn pri" data-act="save-user" data-id="${u.id||""}">Enregistrer</button></div>`)}
function mdpProvisoire(){const c="abcdefghjkmnpqrstuvwxyz",d="23456789";let s="";for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return "Rh"+s+d[Math.floor(Math.random()*8)]+d[Math.floor(Math.random()*8)]}
async function saveUser(id){if(!checkForm())return;const f=$("#frm"),x={nom:f.nom.value,prenom:f.prenom.value,role:f.role.value,telephone:f.telephone.value};
  try{if(id)await api("users.update",{id,user:x});else{x.username=f.username.value;x.email=f.email.value;x.password=f.password.value;await api("users.create",{user:x});
    try{await navigator.clipboard.writeText(`ERP RH SECOP & FOOD\nAdresse : ${location.href.split("#")[0]}\nIdentifiant : ${x.username}\nMot de passe provisoire : ${x.password}`)}catch(e){}}
    closeModal();toast(id?"Compte modifié":"Compte créé. Identifiants copiés : collez-les dans un message à la personne.");loadUsers()}catch(e){toast(e.message)}}
function resetPwForm(id){const u=USERS.find(x=>x.id===id);openModal(`<div class="mhead"><h2>Réinitialiser le mot de passe</h2><button class="btn sm" data-act="close">Fermer</button></div><p>Compte de <b>${esc([u.prenom,u.nom].filter(Boolean).join(" "))}</b> (${esc(u.username)}).</p>
  <form class="form" id="frm"><label class="full">Nouveau mot de passe provisoire<input name="password" required value="${mdpProvisoire()}"></label></form><div class="mfoot"><button class="btn" data-act="close">Annuler</button><button class="btn pri" data-act="save-reset" data-id="${id}">Réinitialiser</button></div>`)}
async function saveReset(id){if(!checkForm())return;const p=$("#frm").password.value,u=USERS.find(x=>x.id===id);try{await api("users.reset_password",{id,password:p});try{await navigator.clipboard.writeText(`Identifiant : ${u.username}\nMot de passe provisoire : ${p}`)}catch(e){}closeModal();toast("Mot de passe réinitialisé et copié.");loadUsers()}catch(e){toast(e.message)}}

(async()=>{
  TOKEN=lsGet("rh_token");
  if(TOKEN){try{const r=await api("auth.me");await startSession({user:r.user,token:TOKEN});return}catch(e){if(e.status===428)return;TOKEN=null;lsSet("rh_token",null)}}
  try{const st=await api("setup.status");st.needsSetup?showSetup():showLogin()}catch(e){showLogin(e.message)}
})();
</script>
</body>
</html>
